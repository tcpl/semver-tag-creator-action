name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create (e.g. 1.3.8 or 1.4.0-rc1)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - name: Verify dist is up to date
        run: |
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/ is out of date. Run 'npm run build' locally and commit the result before releasing."
            git diff --stat -- dist/
            exit 1
          fi
      - name: Tag and push
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
